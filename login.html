<!DOCTYPE html>
<html>
<head>
    <title>FriendMart Login</title>
</head>
<body style="background:#0f172a; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh;">

<div style="background:#1e293b; padding:30px; border-radius:12px; width:350px;">
    <h2 style="text-align:center;">FriendMart Login</h2>

    <input type="email" placeholder="Email" style="width:100%; padding:10px; margin:10px 0;">

    <input type="password" placeholder="Password" style="width:100%; padding:10px; margin:10px 0;">

    <select id="role" style="width:100%; padding:10px; margin:10px 0;">
        <option>Buyer</option>
        <option>Seller</option>
        <option>Admin</option>
    </select>

    <button id="loginBtn" style="width:100%; padding:10px; background:#2563eb; color:white; border:none; border-radius:8px;">
        Login
    </button>

    <p style="text-align:center;">
        New User?
        <a href="register.html" style="color:#60a5fa;">Register</a>
    </p>
</div>

<script>
document.getElementById("loginBtn").addEventListener("click", function () {
    const role = document.getElementById("role").value;

    if (role === "Admin") {
        window.location.href = "admin.html";
    } else if (role === "Seller") {
        window.location.href = "seller.html";
    } else {
        window.location.href = "buyer.html";
    }
});
</script>

</body>
</html>
